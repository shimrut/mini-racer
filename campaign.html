<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Racer Campaign</title>
    <link rel="stylesheet" href="campaign.css">
    <link rel="icon" href="public/favicon.ico" type="image/x-icon">
    <script type="module" src="campaign.js"></script>
</head>

<body>
    <main class="campaign-shell" aria-labelledby="campaign-title">
        <img class="campaign-track" src="assets/landing-track.jpg" alt="" width="1200" height="630" decoding="async" fetchpriority="high">
        <div class="campaign-veil" aria-hidden="true"></div>

        <header class="campaign-brand">
            <p class="campaign-eyebrow">Mini Racer</p>
            <h1 id="campaign-title" class="campaign-title">Campaign</h1>
        </header>

        <footer class="campaign-actions">
            <button id="campaign-race-btn" class="campaign-race" type="button">Race Campaign</button>
        </footer>
    </main>
</body>

</html>
