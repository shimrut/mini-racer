<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Racer Analytics</title>
    <link rel="stylesheet" href="mod-analytics.css">
    <link rel="icon" href="public/favicon.ico" type="image/x-icon">
    <script type="module" src="mod-analytics.js"></script>
</head>

<body>
    <main class="analytics-shell" aria-labelledby="analytics-title">
        <header class="analytics-header">
            <div>
                <p class="brand-lockup" aria-label="Mini Racer">
                    <span class="brand-lockup__mini">Mini</span>
                    <span class="brand-lockup__racer">Racer</span>
                </p>
                <h1 id="analytics-title">Analytics</h1>
            </div>
            <p id="analytics-range" class="analytics-range">Last 45 days</p>
        </header>

        <p id="analytics-status" class="analytics-status" role="status">Loading summary…</p>

        <section id="analytics-windows" class="analytics-kpis" aria-label="Unique players" hidden></section>
        <section id="analytics-today" class="analytics-split" aria-label="Today" hidden></section>
        <section id="analytics-trend" class="analytics-card" aria-label="Unique players over time" hidden></section>
        <section id="analytics-tracks" class="analytics-tracks" aria-label="Tracks" hidden></section>
        <section id="analytics-days" class="analytics-card" aria-label="Daily counts" hidden></section>
    </main>
</body>

</html>
