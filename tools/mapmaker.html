<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Racer Mapmaker</title>
    <link rel="stylesheet" href="mapmaker.css?v=3.6">
</head>
<body class="mapmaker-body">
    <header class="maker-header">
        <a class="maker-link local-only" href="../pages/game.html">&larr; Game</a>
        <button id="track-picker-btn" type="button" class="track-picker-btn" aria-haspopup="dialog" title="Open another track">
            <span id="track-picker-name"></span>
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M6 8l4 4 4-4"/></svg>
        </button>
        <button id="new-track-btn" type="button">New track</button>
        <div id="tool-buttons" class="segmented" role="group" aria-label="Tool">
            <button type="button" data-tool="draw">Draw</button>
            <button type="button" data-tool="edit">Edit</button>
        </div>
        <div class="maker-header-actions">
            <a class="maker-link local-only" href="campaign-planner.html">Campaign Planner</a>
            <button id="drive-draft-btn" type="button">Drive Draft</button>
            <button id="save-track-btn" type="button" class="primary-btn">Save</button>
            <button id="panel-toggle-btn" type="button" class="icon-btn" aria-controls="maker-panel" aria-label="Show or hide the panel" title="Show or hide the panel">
                <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2.5" y="3.5" width="15" height="13" rx="2.5"/><path d="M12.5 3.5v13"/></svg>
            </button>
        </div>
    </header>

    <main class="maker-editor">
        <section class="maker-stage">
            <canvas id="map-canvas"></canvas>
            <div id="touch-tools" class="touch-tools" role="toolbar" aria-label="Edit">
                <button type="button" data-action="undo">Undo</button>
                <button type="button" data-action="redo">Redo</button>
                <button type="button" data-action="add-point">Add point</button>
                <button type="button" data-action="delete-point">Delete point</button>
            </div>
            <p id="canvas-hint" class="canvas-hint" role="status"></p>
        </section>

        <aside id="maker-panel" class="maker-sidebar maker-panel-side">
            <section class="panel-section">
                <label class="field">
                    <span>Name</span>
                    <input id="track-name-input" type="text" spellcheck="false" autocomplete="off">
                </label>
            </section>

            <section class="panel-section">
                <div class="panel-head">
                    <h2>Checks</h2>
                    <span id="quality-count" class="pill"></span>
                </div>
                <ul id="quality-issues" class="quality-issues"></ul>
                <details id="flow-tips" class="flow-tips" hidden>
                    <summary>Flow tips <span id="flow-count" class="pill"></span></summary>
                    <p class="field-hint">Suggestions only. They don't block Save.</p>
                    <ul id="flow-rules" class="quality-issues flow-rules"></ul>
                </details>
            </section>

            <section class="panel-section">
                <h2>Shape</h2>
                <div class="field">
                    <span id="corner-label">Wall corners</span>
                    <div id="corner-radius-options" class="segmented segmented-grid" role="radiogroup" aria-labelledby="corner-label"></div>
                </div>
                <div class="field">
                    <span id="ground-label">Ground</span>
                    <div id="ground-options" class="segmented segmented-grid segmented-grid-3" role="radiogroup" aria-labelledby="ground-label"></div>
                </div>
            </section>

            <section class="panel-section">
                <div class="panel-head">
                    <h2>Checkpoints</h2>
                    <span id="checkpoint-count" class="pill"></span>
                </div>
                <div class="button-row">
                    <button id="add-checkpoint-btn" type="button">Add</button>
                    <button id="delete-checkpoint-btn" type="button">Delete</button>
                </div>
                <p class="field-hint">Select one on the map to delete it.</p>
            </section>

            <section class="panel-section">
                <div class="panel-head">
                    <h2>Medal times</h2>
                    <span id="medal-times-state" class="pill">Not set</span>
                </div>
                <div id="draft-laps-list" class="draft-laps-list"></div>
                <div class="medal-time-grid">
                    <label class="field" data-tier="author">
                        <span>Author</span>
                        <input id="medal-author-input" type="number" min="0" step="0.01">
                    </label>
                    <label class="field" data-tier="gold">
                        <span>Gold</span>
                        <input id="medal-gold-input" type="number" min="0" step="0.01">
                    </label>
                    <label class="field" data-tier="silver">
                        <span>Silver</span>
                        <input id="medal-silver-input" type="number" min="0" step="0.01">
                    </label>
                    <label class="field" data-tier="bronze">
                        <span>Bronze</span>
                        <input id="medal-bronze-input" type="number" min="0" step="0.01">
                    </label>
                </div>
                <p id="medal-times-hint" class="field-hint" hidden></p>
            </section>

            <section class="panel-section panel-footer">
                <button id="remove-track-btn" type="button" class="danger-btn">Remove track</button>
            </section>
        </aside>
    </main>

    <dialog id="track-picker-dialog" class="maker-dialog track-picker-dialog" closedby="any" aria-label="Tracks">
        <div class="track-picker-head">
            <input id="track-search" type="search" placeholder="Find a track" aria-label="Find a track" autocomplete="off">
        </div>
        <div id="track-picker-list" class="track-cards"></div>
    </dialog>

    <dialog id="remove-track-dialog" class="maker-dialog" aria-labelledby="remove-track-dialog-title">
        <form method="dialog">
            <h2 id="remove-track-dialog-title">Remove track?</h2>
            <p id="remove-track-dialog-message"></p>
            <div class="maker-dialog-actions">
                <button type="submit" value="cancel">Cancel</button>
                <button type="submit" value="remove" class="danger-btn">Remove</button>
            </div>
        </form>
    </dialog>

    <dialog id="restore-drafts-dialog" class="maker-dialog" aria-labelledby="restore-drafts-dialog-title">
        <form method="dialog">
            <h2 id="restore-drafts-dialog-title">Restore unsaved maps?</h2>
            <p id="restore-drafts-dialog-message"></p>
            <div class="maker-dialog-actions">
                <button type="submit" value="discard">Discard</button>
                <button type="submit" value="restore" class="primary-btn">Restore</button>
            </div>
        </form>
    </dialog>

    <script type="module" src="mapmaker.js?v=3.9"></script>
</body>
</html>
