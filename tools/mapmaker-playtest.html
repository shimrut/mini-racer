<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mapmaker Test Drive</title>
    <link rel="stylesheet" href="../styles/fonts.css">
    <link rel="stylesheet" href="../styles/foundation.css">
    <link rel="stylesheet" href="../styles/race-hud-and-medals.css">
    <link rel="stylesheet" href="../styles/race-controls-and-feedback.css">
    <link rel="stylesheet" href="mapmaker-playtest.css?v=7">
</head>
<body class="drive-body">
    <header class="drive-header">
        <a class="drive-back" href="mapmaker.html">&larr; Mapmaker</a>
        <h1 id="track-title">Test Drive</h1>
        <p id="drive-feedback" class="drive-status">Loading draft…</p>
        <div class="drive-actions">
            <div id="frame-toggle" class="frame-toggle" role="group" aria-label="Race screen">
                <button id="frame-desktop" type="button" aria-pressed="true">Desktop</button>
                <button id="frame-mobile" type="button" aria-pressed="false">Mobile</button>
            </div>
            <button id="reset-button" type="button">Reset</button>
        </div>
    </header>

    <main class="drive-stage">
        <div class="stage-slot">
            <section class="stage" data-frame="desktop" aria-label="Test drive">
                <canvas id="drive-canvas" aria-label="Test drive track and car"></canvas>
                <div class="hud-bar">
                    <div class="hud-left-cluster"></div>
                    <div class="hud-right-cluster">
                        <div class="hud-lap-cluster">
                            <button id="hud-stats-btn" class="hud-stats" type="button" aria-label="Race time" disabled>
                                <div class="hud-stat">
                                    <span id="hud-timer-pause-icon" class="hud-pause-icon" hidden></span>
                                    <span id="time-val" class="hud-value">0.000</span>
                                </div>
                                <div class="hud-stat" id="best-time-display" style="display: none;">
                                    <span id="best-time-val" class="hud-value">--</span>
                                </div>
                            </button>
                        </div>
                    </div>
                </div>
                <div class="mobile-hud-bar">
                    <div id="speedometer" class="speedometer speedometer--pause" role="button" aria-live="off" aria-label="Pause">
                        <div class="speedometer-content">
                            <div id="speed-bar" class="speedometer-bar"></div>
                            <div class="speedometer-text">
                                <span id="speed-val" class="speedometer-value">0</span>
                                <span class="speedometer-label">KPH</span>
                            </div>
                        </div>
                    </div>
                </div>
                <p id="stage-note" class="stage-note" role="status" hidden></p>
                <section id="flow-drive" class="flow-strip" aria-label="Flow on this lap" hidden>
                    <span id="flow-slowest"></span>
                    <span id="flow-gap"></span>
                    <span id="flow-beat"></span>
                    <span id="flow-switch"></span>
                </section>
                <div class="mobile-controls">
                    <div class="control-group">
                        <button id="btn-left" class="touch-btn" type="button" aria-label="Steer left"></button>
                        <button id="btn-right" class="touch-btn" type="button" aria-label="Steer right"></button>
                    </div>
                </div>
            </section>
        </div>
    </main>
    <script type="module" src="mapmaker-playtest.js?v=6"></script>
</body>
</html>
