<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Racer Campaign Planner</title>
    <link rel="stylesheet" href="mapmaker.css?v=3.7">
    <link rel="stylesheet" href="campaign-planner.css?v=2.3">
</head>
<body class="mapmaker-body">
    <header class="maker-header">
        <a class="maker-link" href="mapmaker.html">&larr; Mapmaker</a>
        <h1>Campaign Planner</h1>
        <p id="status-text" class="planner-status"></p>
    </header>

    <main class="maker-layout">
        <aside class="maker-sidebar planner-sidebar">
            <div class="planner-search">
                <input id="list-search" type="search" placeholder="Find a campaign or track" aria-label="Find a campaign or track" autocomplete="off">
            </div>
            <nav id="list-nav" class="planner-nav" aria-label="Lists"></nav>
        </aside>

        <section class="planner-main">
            <div class="planner-main-head">
                <div>
                    <h2 id="list-title"></h2>
                    <p id="list-meta" class="field-hint"></p>
                </div>
                <button id="add-track-btn" type="button" class="primary-btn" hidden>Add track</button>
            </div>
            <div id="list-body" class="planner-main-body"></div>
        </section>
    </main>

    <dialog id="picker-dialog" class="maker-dialog planner-dialog" aria-labelledby="picker-title">
        <form method="dialog">
            <h2 id="picker-title"></h2>
            <div id="picker-choose">
                <input id="picker-search" type="search" placeholder="Search" aria-label="Search" autocomplete="off">
                <div id="picker-list" class="planner-picker-list"></div>
            </div>
            <div id="picker-confirm" hidden>
                <p id="picker-summary"></p>
                <div id="picker-stage-fields" class="button-row">
                    <label class="field">
                        <span>Laps</span>
                        <select id="picker-laps">
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                        </select>
                    </label>
                    <label class="field">
                        <span>Medal Target</span>
                        <input id="picker-target" type="number" min="0" step="1">
                    </label>
                </div>
                <ul id="picker-notes" class="planner-notes"></ul>
            </div>
            <div class="maker-dialog-actions">
                <button type="submit" value="cancel">Cancel</button>
                <button id="picker-back-btn" type="button" hidden>Back</button>
                <button id="picker-confirm-btn" type="button" class="primary-btn" hidden>Confirm</button>
            </div>
        </form>
    </dialog>

    <script type="module" src="campaign-planner.js?v=2.2"></script>
</body>
</html>
