<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Racer Final Podium</title>
    <link rel="stylesheet" href="podium.css">
    <link rel="icon" href="public/favicon.ico" type="image/x-icon">
    <script type="module" src="podium.js"></script>
</head>

<body>
    <main id="podium-shell" class="podium-shell" data-mode="podium" aria-labelledby="podium-title">
        <canvas id="podium-track" class="podium-track" aria-hidden="true"></canvas>
        <div class="ambient" aria-hidden="true">
            <span class="ambient__grain"></span>
            <span class="ambient__streak"></span>
        </div>

        <header class="podium-header">
            <div class="brand-lockup" aria-label="Mini Racer">
                <span class="brand-lockup__mini">Mini</span>
                <span class="brand-lockup__racer">Racer</span>
            </div>

            <div class="result-heading">
                <p class="result-heading__eyebrow">Final podium</p>
                <h1 id="podium-title" class="result-heading__track">Daily GP</h1>
                <p id="challenge-date" class="result-heading__date">Final results</p>
                <p id="race-format" class="result-heading__date">1 LAP</p>
            </div>
        </header>

        <section id="podium-results" class="podium-results" aria-label="Final podium results">
            <ol id="podium-list" class="podium-list">
                <li class="podium-row podium-row--gold" data-rank="1">
                    <span class="podium-row__place" aria-label="First place">
                        <span class="podium-row__number">1</span>
                        <span class="podium-row__ordinal">ST</span>
                    </span>
                    <span class="podium-row__identity">
                        <img class="podium-row__avatar podium-row__avatar--generic" src="https://www.redditstatic.com/avatars/defaults/v2/avatar_default_0.png" alt="">
                        <span class="podium-row__identity-copy">
                            <span class="podium-row__medal" aria-hidden="true">Gold</span>
                            <span class="podium-row__name">No verified finish</span>
                        </span>
                    </span>
                    <span class="podium-row__time" aria-label="No verified time">—</span>
                </li>
                <li class="podium-row podium-row--silver" data-rank="2">
                    <span class="podium-row__place" aria-label="Second place">
                        <span class="podium-row__number">2</span>
                        <span class="podium-row__ordinal">ND</span>
                    </span>
                    <span class="podium-row__identity">
                        <img class="podium-row__avatar podium-row__avatar--generic" src="https://www.redditstatic.com/avatars/defaults/v2/avatar_default_0.png" alt="">
                        <span class="podium-row__identity-copy">
                            <span class="podium-row__medal" aria-hidden="true">Silver</span>
                            <span class="podium-row__name">No verified finish</span>
                        </span>
                    </span>
                    <span class="podium-row__time" aria-label="No verified time">—</span>
                </li>
                <li class="podium-row podium-row--bronze" data-rank="3">
                    <span class="podium-row__place" aria-label="Third place">
                        <span class="podium-row__number">3</span>
                        <span class="podium-row__ordinal">RD</span>
                    </span>
                    <span class="podium-row__identity">
                        <img class="podium-row__avatar podium-row__avatar--generic" src="https://www.redditstatic.com/avatars/defaults/v2/avatar_default_0.png" alt="">
                        <span class="podium-row__identity-copy">
                            <span class="podium-row__medal" aria-hidden="true">Bronze</span>
                            <span class="podium-row__name">No verified finish</span>
                        </span>
                    </span>
                    <span class="podium-row__time" aria-label="No verified time">—</span>
                </li>
            </ol>
        </section>

        <section id="podium-replay" class="podium-replay" hidden>
            <div class="podium-replay__seek-wrap">
                <div class="podium-replay__seek-track" aria-hidden="true">
                    <span class="podium-replay__seek-fill"></span>
                </div>
                <span class="podium-replay__seek-knob" aria-hidden="true"></span>
                <input id="podium-replay-seek" class="podium-replay__seek" type="range" min="0" max="1" value="0" step="1" aria-label="Replay position">
            </div>
            <div class="podium-replay__chrome">
                <div class="podium-replay__playback">
                    <button id="podium-replay-toggle" class="podium-replay__button" type="button" data-playing="false" aria-label="Play">
                        <svg class="podium-replay__icon podium-replay__icon--play" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512" aria-hidden="true" focusable="false">
                            <!--!Font Awesome Free v7.3.1 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.-->
                            <path fill="currentColor" d="M91.2 36.9c-12.4-6.8-27.4-6.5-39.6 .7S32 57.9 32 72l0 368c0 14.1 7.5 27.2 19.6 34.4s27.2 7.5 39.6 .7l336-184c12.8-7 20.8-20.5 20.8-35.1s-8-28.1-20.8-35.1l-336-184z"/>
                        </svg>
                        <svg class="podium-replay__icon podium-replay__icon--pause" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 512" aria-hidden="true" focusable="false">
                            <!--!Font Awesome Free v7.3.1 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.-->
                            <path fill="currentColor" d="M48 32C21.5 32 0 53.5 0 80L0 432c0 26.5 21.5 48 48 48l64 0c26.5 0 48-21.5 48-48l0-352c0-26.5-21.5-48-48-48L48 32zm224 0c-26.5 0-48 21.5-48 48l0 352c0 26.5 21.5 48 48 48l64 0c26.5 0 48-21.5 48-48l0-352c0-26.5-21.5-48-48-48l-64 0z"/>
                        </svg>
                    </button>
                </div>
                <div class="podium-replay__clock" aria-live="polite">
                    <span id="podium-replay-time">0.000</span>
                </div>
                <div id="podium-replay-cars" class="podium-replay__cars" role="group" aria-label="Cars to show">
                    <button class="podium-replay__car" type="button" data-rank="1" aria-pressed="true">Gold</button>
                    <button class="podium-replay__car" type="button" data-rank="2" aria-pressed="true">Silver</button>
                    <button class="podium-replay__car" type="button" data-rank="3" aria-pressed="true">Bronze</button>
                    <button id="podium-replay-trail" class="podium-replay__car podium-replay__trail" type="button" aria-pressed="false">Trail</button>
                </div>
                <button id="podium-replay-back" class="podium-replay__car podium-replay__back" type="button" hidden>Back</button>
            </div>
        </section>

        <footer class="podium-footer">
            <span>More tracks. More podiums. Go claim your spot.</span>
            <div class="podium-footer__actions">
                <button id="podium-view-replays" class="podium-play podium-play--view" type="button" hidden>View Replays</button>
                <button id="podium-play" class="podium-play" type="button">Play Now</button>
            </div>
        </footer>
    </main>
</body>

</html>
