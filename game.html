<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Mini Racer</title>
    <link rel="stylesheet" href="styles.css?v=2.14">
    <link rel="icon" href="public/favicon.ico" type="image/x-icon">
</head>

<body class="loading-active start-overlay-active">
    <div id="loading-screen" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="loader-content">
            <div class="loader-text">MINI RACER</div>
            <div class="loader-progress-container">
                <div id="loader-progress-bar" class="loader-progress-bar"></div>
            </div>
            <div id="loader-status" class="loader-status">Initializing...</div>
        </div>
    </div>
    <main id="game-container" role="main" aria-label="Mini Racer racing game">
        <div class="hud-bar">
            <div class="hud-left-cluster">
                <div id="daily-challenge-hud-inline" class="daily-challenge-hud daily-challenge-hud--inline"
                    aria-live="polite" hidden>
                    <span class="daily-challenge-hud__progress"></span>
                    <span class="daily-challenge-hud__type"></span>
                </div>
            </div>

            <div class="hud-right-cluster">
                <div class="hud-lap-cluster">
                    <button id="hud-stats-btn" class="hud-stats" type="button"
                        aria-label="Show your 5 personal best lap times" disabled>
                        <div class="hud-stat"><span id="time-val" class="hud-value">0.00</span></div>
                        <div class="hud-stat" id="best-time-display" style="display: none;">
                            <span id="best-time-val" class="hud-value">--</span>
                            <span id="best-time-medal" class="hud-medal" hidden></span>
                        </div>
                    </button>
                </div>

            </div>

            <div id="lap-flash" class="lap-flash" aria-live="polite" aria-atomic="true">
                <span id="lap-flash-label" class="lap-flash-label">LAP 1</span>
                <span id="lap-flash-time" class="lap-flash-time">0.00s</span>
                <span id="lap-flash-delta" class="lap-flash-delta">FIRST LAP</span>
            </div>
        </div>

        <canvas id="trackLayerCanvas" class="game-layer-canvas" aria-hidden="true"></canvas>
        <canvas id="gameCanvas" class="game-layer-canvas" aria-label="Racing track and car"></canvas>
        <div id="start-overlay" role="region" aria-label="Daily challenge start screen">
            <div id="start-group">
                <header class="lobby-header">
                    <h1 class="lobby-title">
                        <span class="lobby-title__mini">MINI</span>
                        <span class="lobby-title__racer">RACER</span>
                    </h1>
                </header>

                <div class="main-menu">
                    <button id="daily-challenge-rank-btn" class="main-menu__item" type="button">
                        <svg xmlns="http://www.w3.org/2000/svg" class="main-menu__icon" viewBox="0 0 640 640"
                            fill="currentColor" aria-hidden="true">
                            <path
                                d="M353.8 118.1L330.2 70.3C326.3 62 314.1 61.7 309.8 70.3L286.2 118.1L233.9 125.6C224.6 127 220.6 138.5 227.5 145.4L265.5 182.4L256.5 234.5C255.1 243.8 264.7 251 273.3 246.7L320.2 221.9L366.8 246.3C375.4 250.6 385.1 243.4 383.6 234.1L374.6 182L412.6 145.4C419.4 138.6 415.5 127.1 406.2 125.6L353.9 118.1zM288 320C261.5 320 240 341.5 240 368L240 528C240 554.5 261.5 576 288 576L352 576C378.5 576 400 554.5 400 528L400 368C400 341.5 378.5 320 352 320L288 320zM80 384C53.5 384 32 405.5 32 432L32 528C32 554.5 53.5 576 80 576L144 576C170.5 576 192 554.5 192 528L192 432C192 405.5 170.5 384 144 384L80 384zM448 496L448 528C448 554.5 469.5 576 496 576L560 576C586.5 576 608 554.5 608 528L608 496C608 469.5 586.5 448 560 448L496 448C469.5 448 448 469.5 448 496z" />
                        </svg>
                        <span class="main-menu__text">
                            <span class="main-menu__label">Standings</span>
                            <span id="daily-challenge-rank-status" class="main-menu__detail" aria-live="polite" hidden></span>
                        </span>
                    </button>
                    <button id="daily-challenge-playlist-btn" class="main-menu__item" type="button">
                        <svg xmlns="http://www.w3.org/2000/svg" class="main-menu__icon" viewBox="0 0 640 640"
                            fill="currentColor" aria-hidden="true">
                            <path
                                d="M287.9 96L211.7 96C182.3 96 156.6 116.1 149.6 144.6L65.4 484.5C57.9 514.7 80.8 544 112 544L287.9 544L287.9 480C287.9 462.3 302.2 448 319.9 448C337.6 448 351.9 462.3 351.9 480L351.9 544L528 544C559.2 544 582.1 514.7 574.6 484.5L490.5 144.6C483.4 116.1 457.8 96 428.3 96L351.9 96L351.9 160C351.9 177.7 337.6 192 319.9 192C302.2 192 287.9 177.7 287.9 160L287.9 96zM351.9 288L351.9 352C351.9 369.7 337.6 384 319.9 384C302.2 384 287.9 369.7 287.9 352L287.9 288C287.9 270.3 302.2 256 319.9 256C337.6 256 351.9 270.3 351.9 288z" />
                        </svg>
                        <span class="main-menu__label">Tracks</span>
                    </button>
                    <button id="menu-btn-achievements" class="main-menu__item" type="button" hidden>
                        <svg xmlns="http://www.w3.org/2000/svg" class="main-menu__icon" viewBox="0 0 640 640"
                            fill="currentColor" aria-hidden="true">
                            <path
                                d="M208.3 64L432.3 64C458.8 64 480.4 85.8 479.4 112.2C479.2 117.5 479 122.8 478.7 128L528.3 128C554.4 128 577.4 149.6 575.4 177.8C567.9 281.5 514.9 338.5 457.4 368.3C441.6 376.5 425.5 382.6 410.2 387.1C390 415.7 369 430.8 352.3 438.9L352.3 512L416.3 512C434 512 448.3 526.3 448.3 544C448.3 561.7 434 576 416.3 576L224.3 576C206.6 576 192.3 561.7 192.3 544C192.3 526.3 206.6 512 224.3 512L288.3 512L288.3 438.9C272.3 431.2 252.4 416.9 233 390.6C214.6 385.8 194.6 378.5 175.1 367.5C121 337.2 72.2 280.1 65.2 177.6C63.3 149.5 86.2 127.9 112.3 127.9L161.9 127.9C161.6 122.7 161.4 117.5 161.2 112.1C160.2 85.6 181.8 63.9 208.3 63.9zM165.5 176L113.1 176C119.3 260.7 158.2 303.1 198.3 325.6C183.9 288.3 172 239.6 165.5 176zM444 320.8C484.5 297 521.1 254.7 527.3 176L475 176C468.8 236.9 457.6 284.2 444 320.8z" />
                        </svg>
                        <span class="main-menu__label">Achievements</span>
                    </button>
                    <button id="menu-btn-garage" class="main-menu__item" type="button" aria-expanded="false"
                        aria-controls="garage-modal">
                        <svg xmlns="http://www.w3.org/2000/svg" class="main-menu__icon" viewBox="0 0 640 640"
                            fill="currentColor" aria-hidden="true">
                            <path
                                d="M32 206.1L32 544C32 561.7 46.3 576 64 576C81.7 576 96 561.7 96 544L96 304C96 286.3 110.3 272 128 272L512 272C529.7 272 544 286.3 544 304L544 544C544 561.7 558.3 576 576 576C593.7 576 608 561.7 608 544L608 206.1C608 178.6 590.4 154.1 564.2 145.4L335.2 69.1C325.3 65.8 314.7 65.8 304.8 69.1L75.8 145.4C49.6 154.1 32 178.6 32 206.1zM496 320L144 320L144 384L496 384L496 320zM144 480L496 480L496 416L144 416L144 480zM496 512L144 512L144 576L496 576L496 512z" />
                        </svg>
                        <span class="main-menu__label">Garage</span>
                    </button>
                    <button id="menu-btn-settings" class="main-menu__item" type="button">
                        <svg xmlns="http://www.w3.org/2000/svg" class="main-menu__icon" viewBox="0 0 640 640"
                            fill="currentColor" aria-hidden="true">
                            <path
                                d="M259.1 73.5C262.1 58.7 275.2 48 290.4 48L350.2 48C365.4 48 378.5 58.7 381.5 73.5L396 143.5C410.1 149.5 423.3 157.2 435.3 166.3L503.1 143.8C517.5 139 533.3 145 540.9 158.2L570.8 210C578.4 223.2 575.7 239.8 564.3 249.9L511 297.3C511.9 304.7 512.3 312.3 512.3 320C512.3 327.7 511.8 335.3 511 342.7L564.4 390.2C575.8 400.3 578.4 417 570.9 430.1L541 481.9C533.4 495 517.6 501.1 503.2 496.3L435.4 473.8C423.3 482.9 410.1 490.5 396.1 496.6L381.7 566.5C378.6 581.4 365.5 592 350.4 592L290.6 592C275.4 592 262.3 581.3 259.3 566.5L244.9 496.6C230.8 490.6 217.7 482.9 205.6 473.8L137.5 496.3C123.1 501.1 107.3 495.1 99.7 481.9L69.8 430.1C62.2 416.9 64.9 400.3 76.3 390.2L129.7 342.7C128.8 335.3 128.4 327.7 128.4 320C128.4 312.3 128.9 304.7 129.7 297.3L76.3 249.8C64.9 239.7 62.3 223 69.8 209.9L99.7 158.1C107.3 144.9 123.1 138.9 137.5 143.7L205.3 166.2C217.4 157.1 230.6 149.5 244.6 143.4L259.1 73.5zM320.3 400C364.5 399.8 400.2 363.9 400 319.7C399.8 275.5 363.9 239.8 319.7 240C275.5 240.2 239.8 276.1 240 320.3C240.2 364.5 276.1 400.2 320.3 400z" />
                        </svg>
                        <span class="main-menu__label">Settings</span>
                    </button>

                    <button id="daily-challenge-start-btn" class="main-menu__item main-menu__item--primary"
                        type="button" disabled>
                        <span class="main-menu__label">Race</span>
                    </button>
                </div>
            </div>
        </div>

        <div id="start-lights">
            <div class="light" id="light-1"></div>
            <div class="light" id="light-2"></div>
            <div class="light" id="light-3"></div>
        </div>

        <div id="go-message">GO!</div>
        <div class="mobile-hud-bar">
            <div id="desktop-speedometer" class="speedometer speedometer--desktop" aria-live="off"
                aria-label="Current speed">
                <div class="speedometer-content">
                    <div id="speed-bar" class="speedometer-bar"></div>
                    <div class="speedometer-text">
                        <span id="speed-val" class="speedometer-value">0</span>
                        <span class="speedometer-label">KPH</span>
                    </div>
                </div>
            </div>
            <div id="mobile-speedometer" class="mobile-speedometer" aria-live="off" aria-label="Current speed">
                <div class="speedometer-content">
                    <div id="mobile-speed-bar" class="speedometer-bar"></div>
                    <div class="speedometer-text">
                        <span id="mobile-speed-val" class="mobile-speedometer-value">0</span>
                        <span class="mobile-speedometer-label">KPH</span>
                    </div>
                </div>
            </div>
            <button id="pause-btn" class="hud-pause-btn" type="button" aria-label="Pause run" hidden>
                <span class="hud-pause-icon" aria-hidden="true"></span>
                <span class="hud-pause-label">PAUSE</span>
            </button>
        </div>

        <div class="mobile-controls">
            <div class="control-group">
                <button id="btn-left" class="touch-btn" type="button" aria-label="Steer left"></button>
                <button id="btn-right" class="touch-btn" type="button" aria-label="Steer right"></button>
            </div>
        </div>

        <div id="modal" class="modal result-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
            <div class="modal-card">
                <div id="modal-main-view" class="modal-view" style="flex: 1; min-height: 85vh;">
                    <div class="modal-card-section" style="background: transparent; border: none; box-shadow: none; flex: 1; display: flex; flex-direction: column; justify-content: space-between; padding: 2rem 0; width: 100%;">
                        <div class="pause-header" style="text-align: center; margin-top: 1rem; display: flex; flex-direction: column; align-items: center;">
                            <div id="modal-crash-icon-container" style="display: flex; justify-content: center; align-items: center; margin-bottom: 0.5rem; width: 100%;"></div>
                            <h2 id="modal-title" class="leaderboard-hero-track" style="margin-bottom: 1.5rem; font-size: 2rem; letter-spacing: 0.15em;">CRASHED</h2>
                            <div class="combined-hero-time-group" style="margin-top: 1rem; margin-bottom: 2rem; display: flex; flex-direction: column; align-items: center;">
                                <span style="opacity: 0.6; text-transform: uppercase; font-size: 0.9rem; font-weight: 800; letter-spacing: 0.1em; margin-bottom: 0.25rem;">IMPACT</span>
                                <div id="modal-msg" style="font-size: 3.5rem; font-weight: 900; font-style: italic; letter-spacing: 0.05em; line-height: 1; text-shadow: 0 4px 12px rgba(0,0,0,0.3); color: var(--accent-color); text-transform: uppercase;">SPEED</div>
                            </div>
                        </div>
                        <div class="combined-actions" style="display: flex; flex-direction: column; width: 100%; max-width: 320px; gap: 0.75rem; margin: 0 auto;">
                            <button id="modal-crash-retry-btn" class="combined-action-btn combined-action-btn--primary" type="button" aria-label="Retry race" style="width: 100%; border-radius: 99px; font-size: 1.25rem; font-style: italic; font-weight: 900; letter-spacing: 0.1em;">
                                <span class="combined-action-btn-label">RETRY</span>
                            </button>
                            <button id="modal-crash-playlist-btn" class="combined-action-btn" type="button" aria-label="Change day" style="width: 100%; background: rgba(51, 65, 85, 0.8); border-radius: 99px; font-size: 1.25rem; font-style: italic; font-weight: 900; letter-spacing: 0.1em;">
                                <span class="combined-action-btn-label">CHANGE DAY</span>
                            </button>
                            <button id="modal-crash-menu-btn" class="combined-action-btn" type="button" aria-label="Home" style="width: 100%; background: rgba(51, 65, 85, 0.8); border-radius: 99px; font-size: 1.25rem; font-style: italic; font-weight: 900; letter-spacing: 0.1em;">
                                <span class="combined-action-btn-label">HOME</span>
                            </button>
                        </div>
                    </div>
                </div>

                <div id="modal-pause-view" class="modal-view" style="flex: 1; min-height: 85vh;">
                    <div class="modal-card-section" style="background: transparent; border: none; box-shadow: none; flex: 1; display: flex; flex-direction: column; justify-content: space-between; padding: 2rem 0; width: 100%;">
                        <div class="pause-header" style="text-align: center; margin-top: 1rem;">
                            <h2 class="leaderboard-hero-track" style="margin-bottom: 0.5rem; font-size: 2.5rem; letter-spacing: 0.15em;">PAUSED</h2>
                            <div id="modal-pause-track-name" style="font-size: 1.1rem; opacity: 0.8; text-transform: uppercase; font-style: italic; font-weight: 800; letter-spacing: 0.05em; color: var(--text-color);"></div>
                        </div>
                        <div class="combined-actions" style="display: flex; flex-direction: column; width: 100%; max-width: 320px; gap: 0.75rem; margin: 0 auto;">
                            <button id="modal-resume-btn" class="combined-action-btn combined-action-btn--primary" type="button" aria-label="Resume race" style="width: 100%; border-radius: 99px; font-size: 1.25rem; font-style: italic; font-weight: 900; letter-spacing: 0.1em;">
                                <span class="combined-action-btn-label">RESUME</span>
                            </button>
                            <button id="modal-restart-btn" class="combined-action-btn" type="button" aria-label="Restart race" style="width: 100%; background: rgba(51, 65, 85, 0.8); border-radius: 99px; font-size: 1.25rem; font-style: italic; font-weight: 900; letter-spacing: 0.1em;">
                                <span class="combined-action-btn-label">RESTART</span>
                            </button>
                            <button id="modal-menu-btn" class="combined-action-btn" type="button" aria-label="Home" style="width: 100%; background: rgba(51, 65, 85, 0.8); border-radius: 99px; font-size: 1.25rem; font-style: italic; font-weight: 900; letter-spacing: 0.1em;">
                                <span class="combined-action-btn-label">HOME</span>
                            </button>
                        </div>
                    </div>
                </div>

                <div id="modal-runs-view" class="modal-view">
                    <div class="modal-card-section modal-card-section--runs reusable-modal-sheet">
                        <div class="reusable-modal-header">
                            <div class="reusable-modal-heading">
                                <span id="modal-runs-title" class="leaderboard-hero-track" data-modal-title>Your 5 PBs</span>
                                <span id="modal-runs-subtitle" class="leaderboard-subhead" data-modal-subtitle hidden></span>
                            </div>
                        </div>
                        <div id="modal-lap-times" class="modal-lap-times-container reusable-modal-content"
                            data-modal-content></div>
                        <button id="back-to-main-btn" class="combined-action-btn modal-sheet-dismiss" type="button" aria-label="Back" data-modal-close>
                            <span class="combined-action-btn-label">Back</span>
                        </button>
                    </div>
                </div>

                <div id="modal-combined-view" class="modal-view" style="flex: 1; min-height: 85vh;">
                    <div class="modal-card-section">
                        <div class="pause-header">
                            <div class="combined-hero-time-group">
                                <span id="combined-time">--</span>
                            </div>
                            <div id="combined-hero-medal"></div>

                            <div class="combined-stats-grid">
                                <div class="stat-floating-item">
                                    <span id="combined-stat-label-2" class="combined-stat-label" hidden aria-hidden="true"></span>
                                    <span id="combined-best-lap" class="combined-stat-value--pb-delta">--</span>
                                </div>
                                <div id="combined-stats-right-group" class="stat-floating-item" hidden aria-hidden="true">
                                    <span class="combined-stat-label">RANK</span>
                                    <div class="combined-rank-container">
                                        <div id="combined-rank-value"></div>
                                        <div id="combined-rank-total"></div>
                                    </div>
                                </div>
                                <div id="combined-next-medal-stat" class="stat-floating-item" hidden aria-hidden="true">
                                    <span id="combined-stat-label-next" class="combined-stat-label">NEXT</span>
                                    <div class="combined-next-medal-container">
                                        <span id="combined-next-medal-time">--</span>
                                        <span id="combined-next-medal-icon-slot"></span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="combined-actions">
                            <button id="combined-restart-btn" class="combined-action-btn combined-action-btn--primary" type="button" aria-label="Improve time">
                                <span class="combined-action-btn-label">RETRY</span>
                            </button>
                            <button id="combined-playlist-btn" class="combined-action-btn" type="button" aria-label="Change day">
                                <span class="combined-action-btn-label">CHANGE DAY</span>
                            </button>
                            <button id="combined-garage-btn" class="combined-action-btn" type="button" aria-label="Garage" style="display: none;"></button>
                            <button id="combined-menu-btn" class="combined-action-btn" type="button" aria-label="Home">
                                <span class="combined-action-btn-label">HOME</span>
                            </button>
                            <button id="combined-settings-btn" class="combined-action-btn" type="button" aria-label="Settings" style="display: none;"></button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="settings-modal" class="modal result-modal" role="dialog" aria-modal="true"
            aria-labelledby="modal-settings-title">
            <div class="modal-card">
                <div id="modal-settings-view" class="modal-view active-view">
                    <div class="modal-card-section modal-card-section--sheet reusable-modal-sheet">
                        <div class="reusable-modal-header">
                            <div class="reusable-modal-heading">
                                <span id="modal-settings-title" class="leaderboard-hero-track"
                                    data-modal-title>Settings</span>
                                <span class="leaderboard-subhead" data-modal-subtitle hidden></span>
                            </div>
                        </div>
                        <div class="reusable-modal-content" data-modal-content>
                        <div class="modal-sheet-panel modal-sheet-panel--reddit-identity">
                            <div class="modal-sheet-settings-identity-head">
                                <span id="settings-reddit-heading" class="modal-sheet-settings-identity-heading">
                                    Username: Off</span>
                                <input type="checkbox" id="settings-reddit-identity-switch"
                                    class="modal-sheet-settings-switch" aria-labelledby="settings-reddit-heading" />
                            </div>
                            <p id="settings-identity-desc" class="modal-sheet-settings-identity-desc"></p>
                        </div>

                        <p class="leaderboard-subhead settings-subsection-label">Sound</p>
                        <div class="modal-sheet-panel modal-sheet-panel--audio-group">
                            <div class="modal-sheet-settings-identity-head">
                                <span id="settings-car-audio-heading"
                                    class="modal-sheet-settings-identity-heading">Sound Effects: Off</span>
                                <input type="checkbox" id="settings-car-audio-switch"
                                    class="modal-sheet-settings-switch" aria-labelledby="settings-car-audio-heading" />
                            </div>
                            <div class="modal-sheet-settings-row-divider"></div>
                            <div class="modal-sheet-settings-identity-head">
                                <span id="settings-music-heading" class="modal-sheet-settings-identity-heading">Music:
                                    Off</span>
                                <input type="checkbox" id="settings-music-switch" class="modal-sheet-settings-switch"
                                    aria-labelledby="settings-music-heading" />
                            </div>
                        </div>

                        <p class="leaderboard-subhead settings-subsection-label">Racing</p>
                        <div class="modal-sheet-panel modal-sheet-panel--racing-group">
                            <div class="modal-sheet-settings-identity-head">
                                <span id="settings-crash-auto-restart-heading"
                                    class="modal-sheet-settings-identity-heading">Crash Auto-Restart: Off</span>
                                <input type="checkbox" id="settings-crash-auto-restart-switch"
                                    class="modal-sheet-settings-switch"
                                    aria-labelledby="settings-crash-auto-restart-heading" />
                            </div>
                            <div class="modal-sheet-settings-row-divider"></div>
                            <div class="modal-sheet-settings-row modal-sheet-settings-row--crash-delay">
                                <span id="settings-crash-restart-delay-heading"
                                    class="modal-sheet-settings-identity-heading">Crash Respawn Delay</span>
                                <span id="settings-crash-restart-delay-value" class="modal-sheet-settings-delay-value"
                                    aria-live="polite">0.5 s</span>
                            </div>
                            <div class="settings-crash-delay-control-row">
                                <button type="button" id="settings-crash-restart-delay-minus"
                                    class="settings-crash-delay-stepper" aria-label="Shorter throttle lock">-</button>
                                <div id="settings-crash-restart-delay-meter" class="settings-crash-delay-meter"
                                    role="slider" tabindex="0" aria-labelledby="settings-crash-restart-delay-heading"
                                    aria-valuemin="0" aria-valuemax="10" aria-valuenow="5"></div>
                                <button type="button" id="settings-crash-restart-delay-plus"
                                    class="settings-crash-delay-stepper" aria-label="Longer throttle lock">+</button>
                            </div>
                        </div>

                        </div>
                        <button id="settings-back-btn" class="combined-action-btn modal-sheet-dismiss" type="button" aria-label="Close" data-modal-close>
                            <span class="combined-action-btn-label">Close</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div id="achievements-modal" class="modal result-modal" role="dialog" aria-modal="true"
            aria-labelledby="modal-achievements-title">
            <div class="modal-card">
                <div id="modal-achievements-view" class="modal-view active-view">
                    <div class="modal-card-section modal-card-section--sheet">
                        <div class="runs-header-row leaderboard-header-row">
                            <div class="leaderboard-header-stack">
                                <span id="modal-achievements-title" class="leaderboard-hero-track">Achievements</span>
                            </div>
                        </div>
                        <div id="achievements-list" class="achievements-list">
                            <!-- Achievements will be rendered here -->
                        </div>
                        <button id="achievements-back-btn" class="combined-action-btn modal-sheet-dismiss" type="button"
                            aria-label="Back">
                            <span class="combined-action-btn-label">Back</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div id="daily-playlist-modal" class="modal result-modal" role="dialog" aria-modal="true"
            aria-labelledby="modal-daily-playlist-title">
            <div class="modal-card">
                <div id="modal-daily-playlist-view" class="modal-view active-view">
                    <div class="modal-card-section modal-card-section--sheet daily-playlist-sheet reusable-modal-sheet">
                        <div class="reusable-modal-header">
                            <div class="reusable-modal-heading">
                                <span id="modal-daily-playlist-title" class="leaderboard-hero-track"
                                    data-modal-title>Tracks</span>
                                <span class="leaderboard-subhead" data-modal-subtitle hidden></span>
                            </div>
                        </div>
                        <div id="daily-playlist-list" class="daily-playlist-list reusable-modal-content"
                            data-modal-content></div>
                        <button id="daily-playlist-close-btn" class="combined-action-btn modal-sheet-dismiss" type="button" aria-label="Close" data-modal-close>
                            <span class="combined-action-btn-label">Close</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div id="garage-modal" class="modal result-modal" role="dialog" aria-modal="true"
            aria-labelledby="modal-garage-title">
            <div class="modal-card">
                <div id="modal-garage-view" class="modal-view active-view">
                    <section id="garage-panel"
                        class="modal-card-section modal-card-section--sheet garage-sheet reusable-modal-sheet"
                        aria-label="Garage" hidden>
                        <div class="reusable-modal-header">
                            <div class="reusable-modal-heading">
                                <span id="modal-garage-title" class="leaderboard-hero-track"
                                    data-modal-title>Garage</span>
                            </div>
                        </div>
                        <div class="reusable-modal-content" data-modal-content>
                        <div class="garage-tabs" role="tablist" aria-label="Garage sections">
                            <button id="garage-tab-skin" class="garage-tab" type="button" role="tab"
                                aria-selected="true" aria-controls="garage-panel-skin">Car</button>
                            <button id="garage-tab-trails" class="garage-tab" type="button" role="tab"
                                aria-selected="false" aria-controls="garage-panel-trails">Trail</button>
                        </div>
                        <div id="garage-panel-skin" class="garage-tab-panel garage-tab-panel--skin" role="tabpanel"
                            aria-labelledby="garage-tab-skin">
                            <div id="garage-skin-grid" class="garage-skin-layout"></div>
                        </div>
                        <div id="garage-panel-trails" class="garage-tab-panel garage-tab-panel--trails" role="tabpanel"
                            aria-labelledby="garage-tab-trails" hidden>
                            <div id="garage-trail-grid" class="garage-trail-grid"></div>
                        </div>
                        </div>
                        <button id="garage-close-btn" class="combined-action-btn modal-sheet-dismiss" type="button" aria-label="Close" data-modal-close>
                            <span class="combined-action-btn-label">Close</span>
                        </button>
                    </section>
                </div>
            </div>
        </div>

    </main>

    <script type="module" src="game/index.js?v=2.14"></script>
</body>

</html>
