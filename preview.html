<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Racer</title>
    <link rel="stylesheet" href="preview.css">
    <link rel="icon" href="public/favicon.ico" type="image/x-icon">
    <script type="module" src="preview.js"></script>
</head>

<body>
    <main class="preview-shell">
        <article class="start-daily-card" aria-label="Today's daily challenge preview">
            <div class="start-daily-card__main">
                <div class="start-daily-card__left">
                    <header class="lobby-header lobby-header--card">
                        <h1 class="lobby-title" aria-label="Mini Racer">
                            <span class="lobby-title__mini">MINI</span>
                            <span class="lobby-title__racer">RACER</span>
                        </h1>
                    </header>
                    <div class="start-daily-card__visual">
                        <div class="track-visual-container">
                            <canvas id="track-preview" width="600" height="400"></canvas>
                        </div>
                    </div>
                </div>

                <div class="start-daily-card__details">
                    <div class="start-daily-card__details-head">
                        <div class="start-daily-card__eyebrow-timer">
                            <span class="timer-label">ENDS IN</span>
                            <span id="time-remaining" class="timer-value">--:--:--</span>
                        </div>
                        <h2 id="track-name" class="start-daily-card__title">...</h2>
                    </div>
                    <p id="time-to-beat" class="start-daily-card__time-to-beat" aria-live="polite" hidden>
                        <!-- Stopwatch: Font Awesome Free v7.2.0 — fontawesome.com/license/free -->
                        <svg class="time-to-beat__icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"
                            aria-hidden="true" focusable="false">
                            <path fill="currentColor"
                                d="M264.5 64C251.2 64 240.5 74.7 240.5 88C240.5 101.3 251.2 112 264.5 112L296.5 112L296.5 137.3C188.5 149.2 104.5 240.8 104.5 352C104.5 471.3 201.2 568 320.5 568C439.8 568 536.5 471.3 536.5 352C536.5 312.2 525.7 274.9 506.9 242.8L535.1 214.6C547.6 202.1 547.6 181.8 535.1 169.3C522.6 156.8 502.3 156.8 489.8 169.3L466.4 192.7C433.5 162.5 391.2 142.4 344.4 137.2L344.4 111.9L376.4 111.9C389.7 111.9 400.4 101.2 400.4 87.9C400.4 74.6 389.7 63.9 376.4 63.9L264.4 63.9zM344.5 248L344.5 352C344.5 365.3 333.8 376 320.5 376C307.2 376 296.5 365.3 296.5 352L296.5 248C296.5 234.7 307.2 224 320.5 224C333.8 224 344.5 234.7 344.5 248z" />
                        </svg>
                        <span id="time-to-beat-text" class="time-to-beat__text"></span>
                    </p>
                </div>
            </div>
        </article>

        <div class="preview-actions">
            <button id="play-button" class="preview-play" type="button">Race Now</button>
        </div>
    </main>
</body>

</html>
