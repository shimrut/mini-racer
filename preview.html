<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Racer</title>
    <link rel="stylesheet" href="preview.css">
    <link rel="icon" href="public/favicon.ico" type="image/x-icon">
    <script type="module" src="preview.js"></script>
</head>

<body>
    <main class="preview-shell">
        <article class="start-daily-card" aria-label="Today's daily challenge preview">
            <span id="challenge-status" class="challenge-status" aria-live="polite"></span>

            <!-- Top bar: track name & time to beat -->
            <div class="card-topbar">
                <h1 id="track-name" class="track-title" aria-label="Track Name">...</h1>
                <div id="time-to-beat" class="hud-stats" aria-live="polite" hidden>
                    <span class="hud-label">Time to Beat</span>
                    <div class="hud-stat">
                        <span id="time-to-beat-medal" class="hud-medal"></span>
                        <span id="time-to-beat-text" class="hud-value"></span>
                    </div>
                </div>
            </div>

            <!-- Track canvas -->
            <div class="track-visual-container">
                <canvas id="track-preview" width="600" height="400"></canvas>
            </div>



        </article>

        <button id="play-button" class="preview-play" type="button">Race Now</button>
    </main>
</body>

</html>
