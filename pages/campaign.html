<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Racer Campaign</title>
    <link rel="stylesheet" href="campaign.css">
    <link rel="icon" href="../public/favicon.ico" type="image/x-icon">
    <script type="module" src="campaign.js"></script>
</head>

<body>
    <main class="campaign-launcher" aria-labelledby="campaign-title">
        <div class="campaign-launcher__track" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <header class="campaign-header">
            <div class="campaign-brand" aria-label="Mini Racer">
                <span class="campaign-brand__mini">Mini</span>
                <span class="campaign-brand__racer">Racer</span>
            </div>
            <div id="campaign-player" class="campaign-player" hidden>
                <span id="campaign-player-name"></span>
                <img id="campaign-player-avatar" class="campaign-player__avatar" alt="">
            </div>
        </header>

        <div class="campaign-content">
            <div class="campaign-brief">
                <section class="campaign-copy">
                    <p id="campaign-eyebrow" class="campaign-eyebrow">Choose your series</p>
                    <h1 id="campaign-title">Campaign</h1>
                    <p id="campaign-description" class="campaign-description">
                        Earn medals and unlock new races as you progress through each series.
                    </p>
                </section>

                <section id="campaign-results" class="campaign-results" aria-label="Campaign results" hidden>
                    <div class="campaign-stats">
                        <p id="campaign-tracks" class="campaign-stat" hidden>
                            <strong id="campaign-tracks-value"></strong>
                            <span>Tracks</span>
                        </p>
                        <p id="campaign-medal-total" class="campaign-stat" hidden>
                            <strong id="campaign-medal-total-value"></strong>
                            <span>Medals</span>
                        </p>
                        <p id="campaign-total-time" class="campaign-stat" hidden>
                            <strong id="campaign-total-time-value"></strong>
                            <span>Best total</span>
                        </p>
                        <p id="campaign-place" class="campaign-place" hidden>
                            <span id="campaign-place-value"></span>
                            <span id="campaign-place-caption" class="campaign-place__label" aria-hidden="true"></span>
                        </p>
                    </div>
                </section>
            </div>

            <canvas id="campaign-track" class="campaign-track" aria-hidden="true" hidden></canvas>
        </div>

        <footer class="campaign-actions">
            <button id="campaign-race-btn" type="button">Race Campaign</button>
        </footer>
    </main>
</body>

</html>
