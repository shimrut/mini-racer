<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Racer Campaign</title>
    <link rel="stylesheet" href="campaign.css">
    <link rel="icon" href="../public/favicon.ico" type="image/x-icon">
    <script type="module" src="campaign.js"></script>
</head>

<body>
    <main class="campaign-launcher" aria-labelledby="campaign-title">
        <div class="campaign-launcher__track" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <header class="campaign-brand" aria-label="Mini Racer">
            <span class="campaign-brand__mini">Mini</span>
            <span class="campaign-brand__racer">Racer</span>
        </header>

        <section class="campaign-copy">
            <div id="campaign-hero" class="campaign-hero">
                <p id="campaign-place" class="campaign-place" hidden>
                    <span class="campaign-place__label" aria-hidden="true">Overall place</span>
                    <span class="campaign-place__figure">
                        <span id="campaign-place-prefix" class="campaign-place__affix"></span>
                        <span id="campaign-place-number" class="campaign-place__number"></span>
                        <span id="campaign-place-suffix" class="campaign-place__affix"></span>
                    </span>
                    <span id="campaign-place-total" class="campaign-place__total"></span>
                </p>
                <div id="campaign-player" class="campaign-player" hidden>
                    <img id="campaign-player-avatar" class="campaign-player__avatar" alt="">
                    <span id="campaign-player-name" class="campaign-player__name"></span>
                </div>
            </div>
            <p id="campaign-eyebrow" class="campaign-eyebrow">The Numbers</p>
            <h1 id="campaign-title">Campaign</h1>
            <p id="campaign-description" class="campaign-description">
                Progress through the full stage series, bank medals, and unlock the next race.
            </p>
            <div id="campaign-medals" class="campaign-medals" aria-label="Medal distribution" hidden>
                <span data-campaign-medal="author"></span>
                <span data-campaign-medal="gold"></span>
                <span data-campaign-medal="silver"></span>
                <span data-campaign-medal="bronze"></span>
            </div>
        </section>

        <footer class="campaign-actions">
            <button id="campaign-race-btn" type="button">Race Campaign</button>
        </footer>
    </main>
</body>

</html>
